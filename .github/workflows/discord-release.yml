name: Discord Update Announcement

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  announce:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Send update announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PATCH_NOTES: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}

        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          # ----------------------------
          # Configuration
          # ----------------------------

          MAX_CHUNK = 3800

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          patch_notes = os.environ.get("PATCH_NOTES", "").strip()
          pr_title = os.environ.get("PR_TITLE", "UMT IKEMEN Update").strip()
          pr_url = os.environ.get("PR_URL", "").strip()

          # ----------------------------
          # Validate webhook
          # ----------------------------

          if not webhook:
              raise SystemExit("ERROR: DISCORD_WEBHOOK_URL is empty.")

          if not webhook.startswith("https://discord.com/api/webhooks/"):
              raise SystemExit(
                  "ERROR: DISCORD_WEBHOOK_URL does not look like a Discord webhook."
              )

          if not patch_notes:
              patch_notes = "No patch notes were provided for this update."

          # ----------------------------
          # Split patch notes
          # ----------------------------

          def split_patch_notes(text, limit):
              chunks = []
              current = ""

              for line in text.splitlines():
                  candidate = line if not current else current + "\n" + line

                  if len(candidate) <= limit:
                      current = candidate
                      continue

                  # Save the existing chunk first.
                  if current:
                      chunks.append(current)
                      current = ""

                  # If one individual line is too long,
                  # split that line into safe-sized pieces.
                  while len(line) > limit:
                      chunks.append(line[:limit])
                      line = line[limit:]

                  current = line

              if current:
                  chunks.append(current)

              return chunks

          chunks = split_patch_notes(patch_notes, MAX_CHUNK)
          total = len(chunks)

          print(f"Patch notes split into {total} Discord message(s).")

          # ----------------------------
          # Send to Discord
          # ----------------------------

          for index, chunk in enumerate(chunks, start=1):

              if total == 1:
                  title = pr_title
              else:
                  title = f"{pr_title} ({index}/{total})"

              embed = {
                  "title": title,
                  "description": chunk,
                  "color": 5814783
              }

              # Only make the title clickable if we have a PR URL.
              if pr_url:
                  embed["url"] = pr_url

              # Different footer for the last part.
              if index == total:
                  embed["footer"] = {
                      "text": "A new UMT IKEMEN update is now live!"
                  }
              else:
                  embed["footer"] = {
                      "text": f"Patch Notes • Part {index} of {total}"
                  }

              payload = {
                  "username": "UMT IKEMEN Updates",
                  "embeds": [embed]
              }

              data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "UMT-IKEMEN-GitHub-Action"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      print(
                          f"Sent Discord message {index}/{total} "
                          f"(HTTP {response.status})"
                      )

              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  print(f"Discord returned HTTP {error.code}:")
                  print(body)
                  raise

              # Avoid hammering Discord if there are many parts.
              if index < total:
                  time.sleep(1)

          print("Discord update announcement completed successfully.")
          PY
