name: Discord Update Announcement

on:
  push:
    branches:
      - main
    paths:
      - "PATCH_NOTES.md"

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send patch notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          NOTES=$(cat PATCH_NOTES.md)

          # Keep the Discord embed safely under its description limit.
          NOTES=$(echo "$NOTES" | head -c 1900)

          PAYLOAD=$(jq -n \
            --arg description "$NOTES" \
            --arg url "$REPO_URL" \
            '{
              username: "UMT IKEMEN Updates",
              embeds: [
                {
                  title: "A new UMT IKEMEN update is live!",
                  description: $description,
                  url: $url,
                  color: 5814783,
                  footer: {
                    text: "Launch the game through the updater to download the latest version."
                  }
                }
              ]
            }')

          curl \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
